<header><a class="brand" href="../"><img src="../mark.svg" alt="">Night Studies</a><div class="navigation"><span data-language-picker></span><button class="plain" data-library data-t="library"></button><button class="save-project" data-save-project data-t="saveProject"></button></div></header>
<main>
<section class="intro"><div class="title-row"><h1>Astral <em>Atelier</em></h1><span class="starlet" aria-hidden="true">✴</span></div><p data-t="intro"></p></section>
<div class="workarea">
<div class="performance">
<section class="theatre" id="theatre" aria-labelledby="modeName"><div class="stage-head"><span class="mode"><i></i><span id="modeName"></span></span><button id="expand"><svg><use href="#expand-icon"/></svg><span data-t="expand"></span></button></div>
<canvas id="stage" width="1600" height="1000" tabindex="0"></canvas>
<div class="stage-foot"><span id="lastMotion" role="status"></span><span class="cast-meter" id="castMeter" hidden><span id="castLabel"></span><meter id="chargeLevel" min="0" max="1"></meter></span><span id="spellCount"></span></div></section>
<div class="controls"><button id="camera" class="primary"><svg><use href="#camera-icon"/></svg><span id="cameraText"></span></button><button id="capture"><svg><use href="#save-icon"/></svg><span data-t="capture"></span></button><button id="sound" aria-pressed="false"></button><button id="undo" data-t="undo"></button><button id="clear" data-t="clear"></button></div>
<div class="ns-performance" data-record-stage="stage" data-filename="Astral-Atelier"></div>
<div class="camera-desk" id="cameraDesk" hidden><label><input id="mirrorFeed" type="checkbox"><span data-t="cameraBackdrop"></span></label><button id="calibrate" data-t="calibrate"></button></div>
<p class="notice" id="notice" role="status"></p><video id="sensor" autoplay playsinline muted hidden></video>
</div>
<aside aria-labelledby="grimoire"><div class="asidetitle"><h2 id="grimoire" data-t="grimoire"></h2><span aria-hidden="true">✦</span></div><p class="guide-intro" data-t="guide"></p>
<div class="spells">
<button data-spell="dust"><svg class="sigil"><use href="#dust-icon"/></svg><span><strong data-t="dust"></strong><small data-guide="dust"></small></span></button>
<button data-spell="bolt"><svg class="sigil"><use href="#bolt-icon"/></svg><span><strong data-t="bolt"></strong><small data-guide="bolt"></small></span></button>
<button data-spell="shield"><svg class="sigil"><use href="#ward-icon"/></svg><span><strong data-t="shield"></strong><small data-guide="shield"></small></span></button>
<button data-spell="ink"><svg class="sigil"><use href="#ink-icon"/></svg><span><strong data-t="ink"></strong><small data-guide="ink"></small></span></button>
<button data-spell="nova"><svg class="sigil"><use href="#nova-icon"/></svg><span><strong data-t="nova"></strong><small data-guide="nova"></small></span></button>
<button data-spell="gate"><svg class="sigil"><use href="#gate-icon"/></svg><span><strong data-t="gate"></strong><small data-guide="gate"></small></span></button>
</div>
<fieldset class="palette"><legend data-t="spectrum"></legend><div><button data-color="vesper"><i></i><span data-t="vesper"></span></button><button data-color="solar"><i></i><span data-t="solar"></span></button><button data-color="tide"><i></i><span data-t="tide"></span></button></div></fieldset>
<div class="power"><label for="power" data-t="power"></label><output id="powerValue" for="power"></output><input type="range" id="power" min="35" max="100" value="75"></div>
</aside>
</div></main>
<dialog id="clearDialog"><form method="dialog"><p data-t="clearAsk"></p><div><button value="cancel" data-t="cancel" autofocus></button><button class="save-project" value="clear" data-t="clear"></button></div></form></dialog>
<script defer src="../performance-record.js?v=1775e8c7f4"></script></body></html>
