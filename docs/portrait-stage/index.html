<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee9e1"><meta name="description" content="Turn a still portrait into a locally animated photographic puppet."><title>Portrait Loom · Night Studies</title><link rel="icon" href="../mark.svg"><link rel="stylesheet" href="stage.css?v=32822993dd"><script src="../i18n.js?v=e4aa568ccb"></script><script src="../common-locales.js?v=770c93482a"></script><script defer src="../library.js?v=e522b8cf6c"></script><script type="module" src="stage.mjs?v=be6f53ee84"></script></head><body>
<main><nav class="topbar"><a href="../index.html" class="wordmark"><span class="mark" aria-hidden="true"></span>Night Studies</a><div class="nav-actions"><span data-language-picker></span><button type="button" data-library data-msg="shelf">작업 보관함</button><button type="button" class="nav-save" data-save-project data-msg="save">프로젝트 저장</button></div></nav>
<header class="mast"><div><h1>Portrait <i>Loom</i></h1></div><p data-msg="intro">사진의 얼굴과 손에 움직임을 입히세요. 내 카메라나 조절판으로 한 장면을 연출할 수 있습니다.</p></header>
<div class="workstation"><section class="stage-panel" aria-labelledby="stageHeading"><div class="stage-bar"><h2 id="stageHeading"><i class="lamp"></i><span data-msg="stage">초상 무대</span></h2><span class="spec" id="rigInfo" aria-live="polite"></span></div>
<div id="dropzone"><div class="framing"><canvas id="portrait" width="720" height="900" tabindex="0"></canvas><div class="corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div><span class="drop-hint" data-msg="drop">사진을 놓아 열기</span></div>
<div class="transport"><div class="segments"><button id="moving" type="button" aria-pressed="true" data-msg="puppet">퍼펫</button><button id="original" type="button" aria-pressed="false" data-msg="original">원본</button></div><button class="silk" id="mesh" type="button" aria-pressed="false"><span aria-hidden="true">⌗</span><span data-msg="mesh">삼각망</span></button><button type="button" id="freeze" class="silk" disabled></button></div>
<div class="film-note"><div><b id="photoName" data-no-i18n>Atelier No. 1</b><span id="photoMeta" class="spec"></span></div><button id="download" class="print" type="button" disabled><span aria-hidden="true">↓</span><span data-msg="png">PNG 저장</span></button></div>
<div class="ns-performance" data-record-stage="portrait" data-filename="Portrait-Loom"></div>
<section class="geometry" id="geometry" hidden><header><h3 data-msg="geometry">원판 기하 측정</h3><small id="geometryMode"></small></header><dl><div><dt data-msg="faceRatio">얼굴 가로 / 세로</dt><dd id="ratioMetric"></dd></div><div><dt data-msg="eyeRatio">양 눈 간격 / 얼굴 폭</dt><dd id="eyeMetric"></dd></div><div><dt data-msg="eyeTilt">눈 선 기울기</dt><dd id="tiltMetric"></dd></div></dl></section></section><aside class="console" data-active="drive"><div class="console-tabs"><button type="button" data-module="source" data-msg="plate" aria-pressed="false">사진 원판</button><button type="button" data-module="drive" data-msg="performer" aria-pressed="true">카메라 연기</button><button type="button" data-module="pose" data-msg="manual" aria-pressed="false">수동 조절</button></div><section class="source module"><header><h2 data-msg="plate">사진 원판</h2></header><div class="source-line"><img id="thumbnail" src="../assets/portrait-model.webp" alt=""><div><button class="soft" id="upload" type="button" data-msg="upload">내 사진 열기</button><p data-msg="formats">JPG · PNG · WebP, 18 MB 이하</p></div></div><div class="quiet-row"><button id="useExample" type="button" class="link" hidden data-msg="sample">기본 사진</button><button id="anchorBtn" class="link" type="button" data-msg="mark">얼굴 위치 지정</button><button id="cancelAnchor" class="link" type="button" hidden data-msg="cancel">취소</button></div><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><p id="sourceState" role="status"></p></section>
<section class="drive module"><header><h2 data-msg="performer">카메라 연기</h2></header><p class="hint" data-msg="cameraHint">정면을 보며 카메라를 켜고, 편안한 표정으로 기준 자세를 맞추세요.</p><button class="camera" id="camera" type="button" data-msg="start">카메라 켜기</button><div class="monitor" hidden><video id="video" muted playsinline></video><div><b data-msg="monitor">라이브 입력</b><small id="channels"></small></div></div><div class="cam-options" hidden><button class="soft" id="calibrate" type="button" data-msg="calibrate">기준 자세 다시 맞추기</button><label class="slider"><span data-msg="response">반응 강도</span><input type="range" id="gain" min="40" max="170" step="1" value="100"><output for="gain">100%</output></label></div><p id="trackingState" role="status"></p></section>
<section class="module pose"><header><h2 data-msg="manual">수동 조절</h2></header><div id="sliders"></div><button id="reset" type="button" class="link" data-msg="reset">수동 조절 초기화</button></section>
</aside></div><footer><p data-msg="privacy">사진과 카메라 영상은 이 기기에서 처리됩니다.</p><span>Night Studies</span></footer><div id="notice" role="status" aria-live="polite"></div></main><script defer src="../performance-record.js?v=0f5bd8d884"></script></body></html>
