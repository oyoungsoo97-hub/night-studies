<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11110f">
<title>FOLEY CLUB · Night Studies</title>
<link rel="icon" href="../mark.svg" type="image/svg+xml">
<link rel="preload" as="image" href="./walker.webp">
<link rel="stylesheet" href="./studio.css?v=b8d990088d">
<script src="../i18n.js?v=e4aa568ccb"></script><script src="../common-locales.js?v=f75a074d39"></script><script src="../studio-locales.js?v=d217893ea4"></script>
  <script defer src="./sound.js?v=0f4a84e2ef"></script>
<script defer src="./film.js?v=9da6bc0255"></script>
<script defer src="./media.js?v=695a810dad"></script>
<script defer src="./share.js?v=3c7f10b8a9"></script>
<script defer src="../library.js?v=e522b8cf6c"></script>
<script defer src="./studio.js?v=cb907eae4a"></script>
</head>
<body>
<main>
  <nav class="utility" aria-label="작품 탐색">
    <a class="home" href="../index.html"><span class="back-icon" aria-hidden="true">‹</span> 작품 목록</a>
    <div class="utility-actions"><span data-language-picker></span><button type="button" data-library>작업 보관함</button><button type="button" data-save-project>프로젝트 저장</button>
    <button id="mute" type="button" aria-label="모니터 음소거" aria-pressed="false"><span aria-hidden="true" class="levels"><i></i><i></i><i></i><i></i></span><span id="muteText">소리 켜짐</span></button></div>
  </nav>
  <header class="mast">
    <h1>FOLEY CLUB<span>.</span></h1>
    <p>무성 장면에 효과음을 녹음하고,<br>타이밍과 공간을 편집하세요.</p>
  </header>
  <div class="workspace">
    <section class="film-panel" aria-labelledby="film-title">
      <div class="film-topline"><h2 data-no-i18n id="film-title">복도 끝의 문</h2><div class="film-tools"><span class="film-format">24 FPS</span><button id="stockFilm" type="button" hidden>기본 장면</button><button id="openFilm" type="button">영상 열기</button><input type="file" id="filmFile" accept="video/mp4,video/webm,.mp4,.webm" hidden></div></div>
      <figure class="screen">
        <canvas id="film" width="1200" height="585" aria-label="한 사람이 어두운 복도를 걸어가 문을 열고 사라지는 8초 장면"></canvas>
        <div id="mediaStage" hidden></div>
        <div class="film-stamp" id="filmMode" aria-hidden="true">미리보기</div>
        <button id="screenPlay" aria-label="장면 미리 보기" title="장면 미리 보기" type="button"><span class="play-icon" aria-hidden="true"></span></button>
        <figcaption class="sr">같은 장면에 두 가지 효과음을 녹음하고 이어 들을 수 있습니다.</figcaption>
      </figure>
      <div class="transport">
        <div class="transport-actions">
          <button class="record" id="record" type="button"><span class="record-dot" aria-hidden="true"></span><span id="recordText">A 녹음</span></button>
          <button class="play" id="play" type="button"><span class="play-icon" aria-hidden="true"></span><span id="playText">미리 보기</span></button>
          <button id="rewind" type="button" aria-label="처음으로" title="처음으로">Ⅰ◀</button>
          <button id="stop" type="button" aria-label="정지" disabled><span class="stop-icon" aria-hidden="true"></span></button>
        </div>
        <span id="timecode" aria-label="재생 시간">00:00:00</span>
      </div>
      <label class="scrub"><span>재생 위치</span><input type="range" id="seek" min="0" max="8" step=".001" value="0" aria-label="장면 재생 위치"></label>
    </section>
    <section class="pads-panel" aria-labelledby="pads-title">
      <div class="section-topline"><h2 id="pads-title">효과음 패드</h2><span class="shortcut-caption">클릭 또는 키 <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span></div>
      <div id="pads">
        <button type="button" class="pad gravel" data-sound="0" aria-label="자갈 발소리, 키 1"><span class="pad-key" aria-hidden="true">1</span><span class="pad-label"><span>자갈 발소리</span><small >자갈 발걸음</small></span><canvas width="132" height="44" aria-hidden="true"></canvas></button>
        <button type="button" class="pad keys" data-sound="1" aria-label="열쇠 꾸러미, 키 2"><span class="pad-key" aria-hidden="true">2</span><span class="pad-label"><span>열쇠 꾸러미</span><small >금속 열쇠</small></span><canvas width="132" height="44" aria-hidden="true"></canvas></button>
        <button type="button" class="pad hinge" data-sound="2" aria-label="문 경첩, 키 3"><span class="pad-key" aria-hidden="true">3</span><span class="pad-label"><span>문 경첩</span><small >금속 경첩</small></span><canvas width="132" height="44" aria-hidden="true"></canvas></button>
      </div>
      <p class="pad-help">녹음 중 패드를 눌러 장면에 소리를 입히세요. 직접 촬영한 MP4·WebM 영상도 열 수 있습니다 (60초 · 12 MB까지).</p>
    </section>
  </div>
  <section class="timeline" aria-labelledby="takes-title">
    <div class="section-topline editor-heading"><div><h2 id="takes-title">큐 편집기</h2><p class="section-hint">파형을 끌어 소리가 시작되는 순간을 맞추세요.</p></div>
      <div class="compare-actions"><button type="button" id="share" disabled>비교 링크</button><button type="button" id="compare" disabled>A · B 이어 듣기</button><button type="button" id="exportWave" class="export" disabled>WAV 저장</button></div>
    </div>
    <div class="edit-toolbar">
      <div class="take-tabs" role="group" aria-label="편집할 테이크">
        <button class="take-select" type="button" data-take="A" aria-pressed="true">테이크 A <span class="tab-count">0</span></button>
        <button class="take-select" type="button" data-take="B" aria-pressed="false">테이크 B <span class="tab-count">0</span></button>
      </div>
      <div class="history-actions"><label class="zoom-label">배율 <select id="timelineZoom" aria-label="타임라인 배율"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></label><button id="copyTake" type="button" disabled>A를 B로 복사</button><button id="undo" type="button" title="실행 취소 (⌘/Ctrl Z)" disabled>실행 취소</button><button id="redo" type="button" title="다시 실행 (⌘/Ctrl Shift Z)" disabled>다시 실행</button></div>
    </div>
    <div id="arrangement" class="arrangement" aria-label="8초 효과음 타임라인">
      <div class="score-scroll" id="scoreScroll"><div class="score-mat">
      <div class="timeline-ruler" aria-hidden="true"><span>0.0</span><span>2.0</span><span>4.0</span><span>6.0</span><span>8.0 s</span></div>
      <div data-track="A" class="take-tracks"></div><div data-track="B" class="take-tracks" hidden></div>
      </div></div>
    </div>
    <div class="inspector">
      <div class="inspector-head"><strong id="inspectTitle">새 큐</strong><span id="cuePosition"></span><select id="cuePicker" aria-label="편집할 큐 선택"><option value="">새 큐</option></select></div>
      <div class="inspector-fields">
        <label>효과음<select id="cueSound"><option value="0">자갈 발소리</option><option value="1">열쇠 꾸러미</option><option value="2">문 경첩</option></select></label>
        <label>변주<select id="cueVariant"><option value="0">테이크 1</option><option value="1">테이크 2</option><option value="2">테이크 3</option></select></label>
        <label>시작 시간 · 초<input type="number" id="cueTime" min="0" max="7.999" step=".001" value="0.000"></label>
        <label class="fader"><span>음량 <output id="gainValue">0 dB</output></span><input type="range" id="cueGain" min="-24" max="6" step="1" value="0"></label>
        <label class="fader"><span>스테레오 위치 <output id="panValue">중앙</output></span><input type="range" id="cuePan" min="-100" max="100" step="1" value="0"></label>
      </div>
      <div class="inspector-actions"><button id="addCue" type="button" class="primary-edit">현재 위치에 큐 추가</button><button id="listenCue" type="button">큐 듣기</button><button id="nudgeBack" type="button" disabled>−1 프레임</button><button id="nudgeForward" type="button" disabled>+1 프레임</button><button id="removeCue" type="button" disabled>큐 삭제</button></div>
    </div>
    <div class="share-fallback" id="shareFallback" hidden><label for="shareField">복사할 비교 링크</label><input id="shareField" type="text" readonly spellcheck="false"></div>
    <button type="button" id="returnMine" hidden>내 테이크로 돌아가기</button>
    <p id="status" role="status" aria-live="polite">A 녹음을 누르면 장면이 처음부터 재생됩니다.</p>
  </section>
</main>
</body>
</html>
