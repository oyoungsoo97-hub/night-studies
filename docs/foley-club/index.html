<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11110f">
<title>FOLEY CLUB · Night Studies</title>
<link rel="preload" as="image" href="./walker.webp">
<link rel="stylesheet" href="./studio.css">
<script defer src="./sound.js"></script>
<script defer src="./film.js"></script>
<script defer src="./share.js"></script>
<script defer src="./studio.js"></script>
</head>
<body>
<main>
  <nav class="utility" aria-label="작품 탐색">
    <a class="home" href="../index.html"><span class="back-icon" aria-hidden="true">‹</span> 작품 목록</a>
    <button id="mute" type="button" aria-pressed="false"><span aria-hidden="true" class="levels"><i></i><i></i><i></i><i></i></span><span id="muteText">소리 켜짐</span></button>
  </nav>
  <header class="mast">
    <h1>FOLEY CLUB<span>.</span></h1>
    <p>발소리, 열쇠, 경첩으로<br>무성 장면의 8초를 채워 보세요.</p>
  </header>
  <div class="workspace">
    <section class="film-panel" aria-labelledby="film-title">
      <div class="film-topline"><h2 id="film-title">복도 끝의 문</h2><span class="film-format" lang="en">24 FPS</span></div>
      <figure class="screen">
        <canvas id="film" width="1200" height="585" aria-label="한 사람이 어두운 복도를 걸어가 문을 열고 사라지는 8초 장면"></canvas>
        <div class="film-stamp" id="filmMode" aria-hidden="true">PREVIEW</div>
        <button id="screenPlay" aria-label="장면 미리 보기" title="장면 미리 보기" type="button"><span class="play-icon" aria-hidden="true"></span></button>
        <figcaption class="sr">같은 장면에 두 가지 효과음을 녹음하고 이어 들을 수 있습니다.</figcaption>
      </figure>
      <div class="transport">
        <div class="transport-actions">
          <button class="record" id="record" type="button"><span class="record-dot" aria-hidden="true"></span><span id="recordText">A 녹음</span></button>
          <button class="play" id="play" type="button"><span class="play-icon" aria-hidden="true"></span><span id="playText">미리 보기</span></button>
          <button id="stop" type="button" aria-label="정지" disabled><span class="stop-icon" aria-hidden="true"></span></button>
        </div>
        <span id="timecode" aria-label="재생 시간">00:00:00</span>
      </div>
    </section>
    <section class="pads-panel" aria-labelledby="pads-title">
      <div class="section-topline"><h2 id="pads-title">효과음 패드</h2><span class="shortcut-caption">클릭 또는 키 <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></span></div>
      <div id="pads">
        <button type="button" class="pad gravel" data-sound="0" aria-label="자갈 발소리, 키 1"><span class="pad-key" aria-hidden="true">1</span><span class="pad-label"><span>자갈 발소리</span><small lang="en">GRAVEL STEPS</small></span><canvas width="132" height="44" aria-hidden="true"></canvas></button>
        <button type="button" class="pad keys" data-sound="1" aria-label="열쇠 꾸러미, 키 2"><span class="pad-key" aria-hidden="true">2</span><span class="pad-label"><span>열쇠 꾸러미</span><small lang="en">KEY RING</small></span><canvas width="132" height="44" aria-hidden="true"></canvas></button>
        <button type="button" class="pad hinge" data-sound="2" aria-label="문 경첩, 키 3"><span class="pad-key" aria-hidden="true">3</span><span class="pad-label"><span>문 경첩</span><small lang="en">DOOR HINGE</small></span><canvas width="132" height="44" aria-hidden="true"></canvas></button>
      </div>
      <p class="pad-help">패드를 눌러 소리를 들어보세요. 녹음 중에 누른 소리는 선택한 테이크에 담깁니다.</p>
    </section>
  </div>
  <section class="timeline" aria-labelledby="takes-title">
    <div class="section-topline"><h2 id="takes-title">테이크 비교</h2><div class="compare-actions"><button type="button" id="share" disabled>비교 링크</button><button type="button" id="compare" disabled>A · B 이어 듣기</button></div></div>
    <div class="track-list" role="group" aria-label="녹음할 테이크 선택">
      <div class="track" data-track="A">
        <button class="take-select" type="button" data-take="A" aria-pressed="true"><b>A</b> 테이크 A</button>
        <div class="lane" aria-hidden="true"><span class="empty-label">비어 있음</span><div class="marks"></div><div class="cursor"></div></div><span class="take-count" aria-label="효과음 수">0</span>
      </div>
      <div class="track" data-track="B">
        <button class="take-select" type="button" data-take="B" aria-pressed="false"><b>B</b> 테이크 B</button>
        <div class="lane" aria-hidden="true"><span class="empty-label">비어 있음</span><div class="marks"></div><div class="cursor"></div></div><span class="take-count" aria-label="효과음 수">0</span>
      </div>
      <div class="ruler" aria-hidden="true"><span>0s</span><span>2s</span><span>4s</span><span>6s</span><span>8s</span></div>
    </div>
    <div class="share-fallback" id="shareFallback" hidden><label for="shareField">복사할 비교 링크</label><input id="shareField" type="text" readonly spellcheck="false"></div>
    <button type="button" id="returnMine" hidden>내 테이크로 돌아가기</button>
    <p id="status" role="status" aria-live="polite">A 녹음을 누르면 장면이 처음부터 재생됩니다.</p>
  </section>
</main>
</body>
</html>
